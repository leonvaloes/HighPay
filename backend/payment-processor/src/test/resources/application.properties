spring.application.name=payment-processor
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level service=${spring.application.name} correlationId=%X{correlationId:-} thread=%thread logger=%logger{36} message="%replace(%msg){'\"','\\\"'}"%n

spring.datasource.url=jdbc:h2:mem:highpay-payment-processor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.flyway.table=flyway_schema_history_processor
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=highpay
spring.rabbitmq.password=highpay_local_password

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,metrics,prometheus

highpay.rabbitmq.payment-exchange=highpay.payments.exchange
highpay.rabbitmq.payment-created-routing-key=payment.created
highpay.rabbitmq.payment-created-queue=highpay.payment-created.queue
highpay.payment-service.base-url=http://localhost:8081
highpay.payment-service.request-timeout-ms=3000
highpay.payment-service.internal-auth-token=test-internal-token
highpay.payment-service.circuit-breaker.failure-threshold=3
highpay.payment-service.circuit-breaker.open-duration-ms=10000
highpay.payment-service.tls.enabled=false
highpay.payment-service.tls.key-store=
highpay.payment-service.tls.key-store-password=
highpay.payment-service.tls.key-store-type=PKCS12
highpay.payment-service.tls.trust-store=
highpay.payment-service.tls.trust-store-password=
highpay.payment-service.tls.trust-store-type=PKCS12
highpay.provider.base-url=http://localhost:8083
highpay.provider.request-timeout-ms=3000
highpay.provider.circuit-breaker.failure-threshold=3
highpay.provider.circuit-breaker.open-duration-ms=10000
highpay.rabbitmq.dead-letter-exchange=highpay.payments.dlx
highpay.rabbitmq.payment-created-dead-letter-routing-key=payment.created.dead-letter
highpay.rabbitmq.payment-created-dead-letter-queue=highpay.payment-created.dlq
highpay.processed-events.retention.enabled=false
highpay.processed-events.retention.fixed-delay-ms=3600000
highpay.processed-events.retention.processed-ttl-days=30
highpay.processed-events.retention.failed-ttl-days=90

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
