spring.application.name=provider-simulator
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level service=${spring.application.name} correlationId=%X{correlationId:-} thread=%thread logger=%logger{36} message="%replace(%msg){'\"','\\\"'}"%n
server.port=8083

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,prometheus

highpay.provider.default-scenario=SUCCESS
highpay.provider.slow-delay-ms=2000
highpay.provider.timeout-delay-ms=10000
