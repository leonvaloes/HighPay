spring.application.name=payment-service
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level service=${spring.application.name} correlationId=%X{correlationId:-} thread=%thread logger=%logger{36} message="%replace(%msg){'\"','\\\"'}"%n

spring.datasource.url=jdbc:postgresql://localhost:5432/highpay
spring.datasource.username=highpay
spring.datasource.password=highpay_local_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=highpay
spring.rabbitmq.password=highpay_local_password

server.port=8081

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,metrics,prometheus

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

highpay.public-auth.enabled=${HIGHPAY_PUBLIC_AUTH_ENABLED:false}
highpay.public-auth.jwt-secret=${HIGHPAY_PUBLIC_AUTH_JWT_SECRET:}
highpay.public-auth.issuer=${HIGHPAY_PUBLIC_AUTH_ISSUER:highpay-local}
highpay.cors.allowed-origins=${HIGHPAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001}

highpay.internal-auth.mode=${HIGHPAY_INTERNAL_AUTH_MODE:token}
highpay.internal-auth.token=${HIGHPAY_INTERNAL_AUTH_TOKEN}

highpay.rabbitmq.payment-exchange=highpay.payments.exchange
highpay.rabbitmq.payment-created-routing-key=payment.created
highpay.rabbitmq.payment-created-queue=highpay.payment-created.queue

highpay.outbox.publisher.enabled=true
highpay.outbox.publisher.fixed-delay-ms=5000
highpay.outbox.publisher.batch-size=20
highpay.outbox.publisher.max-retry-attempts=5
highpay.outbox.retention.enabled=true
highpay.outbox.retention.fixed-delay-ms=3600000
highpay.outbox.retention.published-ttl-days=7
highpay.outbox.retention.failed-ttl-days=30
highpay.rabbitmq.dead-letter-exchange=highpay.payments.dlx
highpay.rabbitmq.payment-created-dead-letter-routing-key=payment.created.dead-letter
highpay.rabbitmq.payment-created-dead-letter-queue=highpay.payment-created.dlq
