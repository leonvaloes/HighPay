services:

  postgres:
    image: postgres:18
    container_name: highpay-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - highpay-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:4-management
    container_name: highpay-rabbitmq
    hostname: highpay-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - highpay-rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  provider-simulator:
    build:
      context: ./backend/provider-simulator
    container_name: highpay-provider-simulator

    environment:
      SERVER_PORT: 8083

    ports:
      - "8083:8083"

    restart: unless-stopped


  payment-service:
    build:
      context: ./backend/payment-service

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      SERVER_PORT: 8081
      HIGHPAY_INTERNAL_AUTH_TOKEN: ${HIGHPAY_INTERNAL_AUTH_TOKEN:?Set HIGHPAY_INTERNAL_AUTH_TOKEN in .env}
      HIGHPAY_PUBLIC_AUTH_ENABLED: ${HIGHPAY_PUBLIC_AUTH_ENABLED:-false}
      HIGHPAY_PUBLIC_AUTH_JWT_SECRET: ${HIGHPAY_PUBLIC_AUTH_JWT_SECRET:-}
      HIGHPAY_PUBLIC_AUTH_ISSUER: ${HIGHPAY_PUBLIC_AUTH_ISSUER:-highpay-local}
      HIGHPAY_CORS_ALLOWED_ORIGINS: ${HIGHPAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3001}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    restart: unless-stopped


  payment-service-gateway:
    image: nginx:1.29-alpine
    container_name: highpay-payment-service-gateway

    depends_on:
      payment-service:
        condition: service_started

    volumes:
      - ./load-balancer/payment-service/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "8081:8081"

    restart: unless-stopped


  payment-processor:
    build:
      context: ./backend/payment-processor
    container_name: highpay-payment-processor

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-service:
        condition: service_started
      provider-simulator:
        condition: service_started

    environment:
      SERVER_PORT: 8082
      HIGHPAY_INTERNAL_AUTH_TOKEN: ${HIGHPAY_INTERNAL_AUTH_TOKEN:?Set HIGHPAY_INTERNAL_AUTH_TOKEN in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      HIGHPAY_PAYMENT_SERVICE_BASE_URL: http://payment-service:8081
      HIGHPAY_PAYMENT_SERVICE_REQUEST_TIMEOUT_MS: 15000
      HIGHPAY_PROVIDER_BASE_URL: http://provider-simulator:8083
      HIGHPAY_PROVIDER_REQUEST_TIMEOUT_MS: 15000

    ports:
      - "8082:8082"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081
    container_name: highpay-frontend

    depends_on:
      payment-service-gateway:
        condition: service_started

    ports:
      - "3001:80"

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: highpay-prometheus

    depends_on:
      payment-service:
        condition: service_started
      payment-processor:
        condition: service_started
      provider-simulator:
        condition: service_started

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - highpay-prometheus-data:/prometheus

    ports:
      - "9090:9090"

    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.3.0
    container_name: highpay-grafana

    depends_on:
      prometheus:
        condition: service_started

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - highpay-grafana-data:/var/lib/grafana

    ports:
      - "3000:3000"

    restart: unless-stopped


volumes:
  highpay-postgres-data:
  highpay-rabbitmq-data:
  highpay-prometheus-data:
  highpay-grafana-data:
