global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/highpay-alerts.yml

scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service:8081

  - job_name: payment-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-processor:8082

  - job_name: provider-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - provider-simulator:8083
